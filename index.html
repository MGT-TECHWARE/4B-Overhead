<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="generator" content="Vite + React" />

    <!-- Title, description, canonical, OG, Twitter, and JSON-LD are injected
         per-route by scripts/post-build.mts so /work and / each ship their
         own metadata. The placeholders below are overwritten at build time. -->
    <title>4B Overhead Doors</title>
    <meta name="description" content="Family-owned, fully insured garage door installation, repair, and maintenance across West &amp; North Texas." />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Inter is bundled by Vite via @fontsource-variable/inter (imported
         in src/index.css). No third-party font request, no render-blocking
         external CSS — kills the Google Fonts dependency. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
